name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Run smoke tests
        run: python tests/test_smoke.py

  doctor-go:
    name: "doctor-go (Go ${{ matrix.go-version }}, ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go-version: ["1.22", "1.27"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: src/doctor-go/go.sum

      - name: Run go vet
        working-directory: src/doctor-go
        run: go vet ./...

      - name: Run go test
        working-directory: src/doctor-go
        run: go test ./... -count=1

      - name: Build doctor-go
        working-directory: src/doctor-go
        run: go build -o doctor-go .

  sdk-ts:
    name: "sdk-ts (Node ${{ matrix.node-version }}, ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: src/sdk-ts/package-lock.json

      - name: Install dependencies
        working-directory: src/sdk-ts
        run: npm ci || npm install

      - name: Typecheck
        working-directory: src/sdk-ts
        run: npm run typecheck

      - name: Run vitest
        working-directory: src/sdk-ts
        run: npm test

      - name: Build
        working-directory: src/sdk-ts
        run: npm run build

  servicectl-go:
    name: "servicectl-go (Go ${{ matrix.go-version }}, ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go-version: ["1.22", "1.27"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: src/servicectl-go/go.sum

      - name: Run go vet
        working-directory: src/servicectl-go
        run: go vet ./...

      - name: Run go test
        working-directory: src/servicectl-go
        run: go test ./... -count=1

      - name: Build servicectl-go
        working-directory: src/servicectl-go
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            go build -o servicectl-go.exe .
          else
            go build -o servicectl-go .
          fi

      - name: Smoke test against the Python CLI
        # End-to-end test: actually scaffold a service through the Go wrapper.
        # Requires Python + servicectl installed; uses the matrix's Python
        # install via the shared `test` job's setup. We don't install the
        # Python CLI here because that would conflict with `pip install -e .`
        # running from the repo root in the `test` job; instead, this smoke
        # test runs after the `test` job passes (via `needs: test`), which
        # means `servicectl` is on PATH for this runner.
        working-directory: src/servicectl-go
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./servicectl-go.exe init smoke-svc --template=go-webapi --no-git --no-readme --output-dir=$GITHUB_WORKSPACE/.ci-smoke
          else
            ./servicectl-go init smoke-svc --template=go-webapi --no-git --no-readme --output-dir=$GITHUB_WORKSPACE/.ci-smoke
          fi
          # Verify the scaffold emitted the expected files.
          test -f $GITHUB_WORKSPACE/.ci-smoke/smoke-svc/go.mod
          test -f $GITHUB_WORKSPACE/.ci-smoke/smoke-svc/cmd/server/main.go
          test -f $GITHUB_WORKSPACE/.ci-smoke/smoke-svc/internal/smoke_svc/server.go
          # Clean up so the runner doesn't fill its disk.
          rm -rf $GITHUB_WORKSPACE/.ci-smoke

  bicep-validate:
    name: "best-effort - Bicep validation (informational only)"
    runs-on: ubuntu-latest
    # This job is informational. The Bicep generated by the Azure overlay
    # is validated against the Bicep CLI in CI, but failures here do not
    # block the main test suite from passing. Bicep CLI behavior varies
    # slightly between versions and platforms, and a failure here usually
    # indicates a Bicep version mismatch rather than a real bug in the
    # generated code (which is tested locally during development).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install servicectl
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Scaffold a sample Azure-deploy service
        run: |
          python -m servicectl init sample-svc \
              --template=python-flask \
              --deploy=azure \
              --azure-region=eastus \
              --no-git \
              --output-dir=_ci_scratch

      - name: Install Bicep CLI
        run: |
          # Pin to a specific Bicep version so the CI environment matches
          # the one we tested locally. Update the version deliberately and
          # re-run the smoke tests if you change this.
          BICEP_VERSION="v0.46.1"
          curl -Lo bicep "https://github.com/Azure/bicep/releases/download/${BICEP_VERSION}/bicep-linux-x64"
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Validate generated Bicep
        # Bicep 0.30+ removed the --file flag in favor of a positional
        # input argument. --outfile is still supported for output.
        run: |
          set -e
          bicep build \
              _ci_scratch/sample-svc/infra/main.bicep \
              --outfile _ci_scratch/sample-svc/infra/main.json
          for env in dev staging prod; do
              bicep build-params \
                  _ci_scratch/sample-svc/infra/${env}.bicepparam \
                  --outfile _ci_scratch/sample-svc/infra/${env}.bicepparam.json
          done
          echo "Bicep and bicepparam builds succeeded."
