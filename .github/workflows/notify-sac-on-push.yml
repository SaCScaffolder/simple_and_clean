            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "  watch attempt $attempt/6: no active sac unmodified PR-variant run to watch, sleeping 5s"
              sleep 5
              continue
            fi
            echo "  watch attempt $attempt/6: watching sac unmodified PR-variant run ${RUN_ID}"
            if GH_TOKEN="${TOKEN}" gh run watch "${RUN_ID}" --repo SaCScaffolder/sac --exit-status; then
              echo "::notice::sac integration-test-pr-unmodified passed for ${{ github.sha }}"
              exit 0
            fi
            CONCLUSION=$(gh api "repos/SaCScaffolder/sac/actions/runs/${RUN_ID}" --jq '.conclusion' 2>/dev/null || echo "unknown")
            if [ "$CONCLUSION" = "cancelled" ]; then
