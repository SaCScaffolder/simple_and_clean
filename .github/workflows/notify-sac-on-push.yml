          exit 1

      - name: Set final status on PR head (unmodified PR variant, green or red)
        if: always() && github.event_name == 'pull_request'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "::add-mask::${TOKEN}"
          if [ "${{ steps.watch-pr-unmod.outcome }}" = "success" ] || [ "${{ steps.find-run-pr-unmod.outcome }}" = "success" ]; then
            STATE="success"
            DESCRIPTION="SAC unmodified per-PR integration test passed"
          else
            STATE="failure"
            DESCRIPTION="SAC unmodified per-PR integration test failed; see the workflow run for details"
          fi
          http_code=$(curl -sS -o /tmp/final_pr_unmod_body.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "{\"state\":\"${STATE}\",\"description\":\"${DESCRIPTION}\",\"context\":\"simple_and_clean / sac-integration-test-pr-unmodified\"}" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${SHA}")
          if [ "${http_code}" != "201" ]; then
            echo "::warning::Failed to set unmodified PR-variant final status (HTTP ${http_code})"
            cat /tmp/final_pr_unmod_body.json || true
          else
            echo "Set unmodified PR-variant final status (${STATE}) on ${SHA}"
          fi

      - name: Set final status on PR head (PR variant, green or red)
        # Updates the pending status set by 'Set pending status on
        # PR head (PR variant)' to `success` or `failure` based on
        # the watch-pr step's outcome. The if: always() ensures the
        # status is updated even if the watch failed, so the PR
        # check doesn't get stuck on yellow.
        if: always() && github.event_name == 'pull_request'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "::add-mask::${TOKEN}"
          if [ "${{ steps.watch-pr.outcome }}" = "success" ] || [ "${{ steps.find-run-pr.outcome }}" = "success" ]; then
            STATE="success"
            DESCRIPTION="SAC per-PR integration test passed"
          else
            STATE="failure"
            DESCRIPTION="SAC per-PR integration test failed; see the workflow run for details"
          fi
          http_code=$(curl -sS -o /tmp/final_pr_body.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "{\"state\":\"${STATE}\",\"description\":\"${DESCRIPTION}\",\"context\":\"simple_and_clean / sac-integration-test-pr\"}" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${SHA}")
          if [ "${http_code}" != "201" ]; then
            echo "::warning::Failed to set PR-variant final status (HTTP ${http_code})"
            cat /tmp/final_pr_body.json || true
          else
            echo "Set PR-variant final status (${STATE}) on ${SHA}"
          fi

      - name: Set final status on PR head (green or red)
        # Updates the pending status set at the start of the workflow
        # to `success` or `failure` based on the watch result. The
        # `if: always()` ensures this runs even if the watch step
        # failed (so we update the status to `failure` and don't
        # leave the PR check stuck on yellow).
        #
        # The status `context` matches the one used in the
        # `Set pending status` step, so this is an update of the
        # same status, not a new one.
        #
        # After the watcher-split change, on a `pull_request` event
        # the `watch` step is SKIPPED (only the PR-variant watchers
        # run). We accept `skipped` as equivalent to `success` here
        # for the unmodified watcher specifically, since its absence
        # is by design for PR events. The PR-variant watchers
        # (`watch-pr`, `watch-pr-unmod`) are required to succeed.
        if: always() && github.event_name == 'pull_request'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "::add-mask::${TOKEN}"
          # Accept `skipped` for the unmodified watcher (it's only
          # required for push events, not pull_request). PR-variant
          # watchers must genuinely succeed.
          WATCH_OK="false"
          if [ "${{ steps.watch.outcome }}" = "success" ] || [ "${{ steps.watch.outcome }}" = "skipped" ]; then
            WATCH_OK="true"
          fi
          if [ "$WATCH_OK" = "true" ] && [ "${{ steps.watch-pr.outcome }}" = "success" ] && [ "${{ steps.watch-pr-unmod.outcome }}" = "success" ] && [ "${{ steps.dispatch-pr.outcome }}" = "success" ]; then
            STATE="success"
            DESCRIPTION="SAC integration test passed"
          else
            STATE="failure"
            DESCRIPTION="SAC integration test failed; see the workflow run for details"
          fi
          http_code=$(curl -sS -o /tmp/final_body.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "{\"state\":\"${STATE}\",\"description\":\"${DESCRIPTION}\",\"context\":\"simple_and_clean / sac-integration-test\"}" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${SHA}")
          if [ "${http_code}" != "201" ]; then
            echo "::warning::Failed to set final status (HTTP ${http_code})"
            cat /tmp/final_body.json || true
          else
            echo "Set final status (${STATE}) on ${SHA}"
          fi
