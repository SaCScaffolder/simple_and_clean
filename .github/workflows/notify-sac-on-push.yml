name: Notify sac on push

# Fires `SaCScaffolder/sac`'s integration test workflows when
# this repo (simple_and_clean) lands a new commit or PR.
#
# The sac integration tests use simple_and_clean as a submodule
# and scaffold an `_unmodified` example from it on every run. When
# simple_and_clean changes, sac needs to know — otherwise the tests
# never re-run against the new code.
#
# How the signal flows:
#
#   1. We push to simple_and_clean@main (or open/sync a PR).
#   2. This workflow runs and mints a fresh GitHub App installation
#      token for SaCScaffolder.
#   3. We POST /repos/SaCScaffolder/sac/dispatches with an
#      event_type that depends on the trigger:
#        - `push` (commit to main): event_type=simple_and_clean-updated
#          -> sac's two post-merge canaries start
#             (`integration-test-unmodified`,
#              `integration-test-modified`)
#        - `pull_request` (PR open/sync/reopen): event_type=simple_and_clean-pr
#          -> sac's two PR variants start
#             (`integration-test-pr`,
#              `integration-test-pr-unmodified`)
#      See the "Watcher split" block below for why we use two
#      event_types instead of one.
#
# We use `actions/create-github-app-token@v1` (not a PAT) so the
# cross-repo call is short-lived and scoped — the App's installation
# on SaCScaffolder grants `contents: write` (needed for dispatches)
# plus the other perms the sac integration test needs.
#
# Triggered by:
#   - push: branches: [main]          (auto-fire on merge to main)
#   - pull_request: types: [opened, synchronize, reopened]
#                                     (auto-fire on PR open / new
#                                     commits pushed to the PR branch
#                                     / reopens. The integration test
#                                     runs against the PR's exact head
#                                     SHA, scaffolding from it via
#                                     `git submodule update --init
#                                     --remote simple_and_clean` to
#                                     the PR's commit, not main's.
#                                     This makes the integration test
#                                     a PR check, not just a post-
#                                     merge canary -- so a bad
#                                     scaffolder change is caught
#                                     before merge, not after.)
#   - workflow_dispatch               (manual re-fire from the
#                                     Actions tab while iterating)
#
# Yellow-while-waiting semantics for PR checks:
#   The doc (C:\Users\henry\source\repos\instructions.txt) requires
#   that the simple_and_clean PR check stay "yellow" (pending) while
#   the SAC integration test is in flight, and only go red on actual
#   failure -- not on the integration test taking a long time. The
#   PR check's green/red is determined by:
#     1. The commit status (set explicitly via the GitHub Status API
#        by the `Set pending status` and `Set final status` steps).
#     2. The workflow run's own success/failure (added automatically
#        by GitHub for any workflow that runs in a PR's check suite).
#   For push events, only #2 applies (pushes don't have a PR check
#   list). The status steps are no-ops on push events because the
#   SHA is the same as the commit the workflow is already reporting
#   on.
#
# Secrets required in SaCScaffolder/simple_and_clean:
#   SAC_DISPATCH_APP_ID       — numeric App ID (5230297)
#   SAC_DISPATCH_APP_PEM      — .pem file contents from the App's
#                                settings (Generate a private key)
#
# We do NOT reuse the APP_ID / APP_PRIVATE_KEY / APP_INSTALLATION_ID
# secrets on sac - different names to make it obvious that this
# workflow has its own secret set, and so that rotating one doesn't
# affect the other.
#
# Watcher split (push vs pull_request):
#   This workflow has four downstream watchers in sac, each with a
#   distinct role. Two are post-merge canaries; two are per-PR
#   variants. Each watcher is only relevant for one trigger type:
#     1. `integration-test-unmodified`           (post-merge canary, unmodified)
#     2. `integration-test-modified`             (post-merge canary, modified)
#     3. `integration-test-pr`                   (PR-variant modified)
#     4. `integration-test-pr-unmodified`        (PR-variant unmodified)
#   Before this change, all four STARTED on every trigger (because
#   they all listened for the single `simple_and_clean-updated`
#   event_type), and this workflow waited on all of them. That was
#   wasteful for the unrelated watchers AND it caused this workflow
#   to report against the wrong SHA context (e.g. a PR would wait
#   for the post-merge canary that runs against main's SHA, not the
#   PR head's SHA).
#
#   After this change (option B: split the event_type so irrelevant
#   watchers don't even start), the dispatch sends a different
#   event_type per trigger, and each sac workflow only listens for
#   the event_type that corresponds to its role:
#     - `push` (commit to main):
#         dispatch: event_type=`simple_and_clean-updated`
#         sac listens: (1) `integration-test-unmodified`,
#                      (2) `integration-test-modified`
#         this workflow waits on: (1) and (2)
#     - `pull_request` (PR open/sync/reopen):
#         dispatch: event_type=`simple_and_clean-pr`
#         sac listens: (3) `integration-test-pr`,
#                      (4) `integration-test-pr-unmodified`
#         this workflow waits on: (3) and (4)
#
#   Each find-run step is gated by the same `if:` guard as before
#   (push vs pull_request) for belt-and-suspenders: even if a
#   listener were misconfigured, this workflow still wouldn't wait
#   on a watcher that's irrelevant to the trigger. The dispatch
#   step itself is also split (one if-guarded step per event_type)
#   so we send exactly one dispatch per run, not two.
#
#   Companion PR in SaCScaffolder/sac changes the
#   `repository_dispatch: types:` filter on each of the four
#   workflows above. This PR is meaningless without that
#   companion: the split here has to be matched by the split there
#   to land cleanly.

"on":
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  notify-sac:
    name: Dispatch to SaCScaffolder/sac
    runs-on: ubuntu-latest
    steps:
      - name: Mint installation token from GitHub App
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SAC_DISPATCH_APP_ID }}
          private-key: ${{ secrets.SAC_DISPATCH_APP_PEM }}
          owner: SaCScaffolder

      - name: Set pending status on PR head (yellow while waiting)
        # For pull_request events: set a `pending` commit status on
        # the PR's head SHA. This makes the simple_and_clean PR check
        # show yellow (with a "waiting on SAC integration test"
        # description) while the SAC run is in flight. The status
        # is updated to `success` or `failure` by the final step.
        #
        # For push events: this is a no-op (we still set the status,
        # but the SHA is the same as `github.sha` which the workflow
        # already reports on via its own run status, and pushes
        # don't have a PR check list to display the status on).
        #
        # The status `context` is `simple_and_clean / sac-integration-test`
        # so it shows up grouped with the simple_and_clean PR's other
        # checks. We POST to /repos/{owner}/{repo}/statuses/{sha} with
        # the installation token. The App's installation has
        # `contents: write` which is sufficient for the status API
        # (status writes don't require a separate scope; any token
        # that can read the repo can write statuses on its commits).
        if: github.event_name == 'pull_request'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "::add-mask::${TOKEN}"
          http_code=$(curl -sS -o /tmp/pending_body.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "{\"state\":\"pending\",\"description\":\"Waiting for SAC integration test to complete (max ~10 min)\",\"context\":\"simple_and_clean / sac-integration-test\"}" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${SHA}")
          if [ "${http_code}" != "201" ]; then
            echo "::warning::Failed to set pending status (HTTP ${http_code}); the PR check will still report via the workflow run's own status"
            cat /tmp/pending_body.json || true
          else
            echo "Set pending status on ${SHA}"
          fi

      - name: POST repository_dispatch to sac (post-merge, push event)
        # Post-merge dispatch: sent only on `push` events. Triggers
        # `simple_and_clean-updated` in sac, which the two post-merge
        # canaries (`integration-test-unmodified`,
        # `integration-test-modified`) listen for. Skipped on
        # `pull_request` events; see the next step for the PR-side
        # dispatch.
        if: github.event_name == 'push'
        id: dispatch-updated
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          # Record the dispatch wall-clock time so the find-run step can
          # filter to runs newer than (now - 60s). The recency filter
          # avoids matching an old failed run from a previous dispatch.
          echo "dispatch_time_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
          # Build the client_payload inline so we can use bash here-doc
          # safely without quoting issues in the JSON.
          payload=$(cat <<EOF
          {
            "event_type": "simple_and_clean-updated",
            "client_payload": {
              "sha": "${SHA}",
              "ref": "${REF}",
              "repository": "${REPO}",
              "sender": "${ACTOR}"
            }
          }
          EOF
          )

          echo "POST https://api.github.com/repos/SaCScaffolder/sac/dispatches"
          echo "Payload:"
          echo "$payload"

          http_code=$(curl -sS -o /tmp/dispatch_body.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            https://api.github.com/repos/SaCScaffolder/sac/dispatches)

          echo "HTTP ${http_code}"
          echo "Body:"
          cat /tmp/dispatch_body.json
          echo

          # 204 No Content = success
          if [ "$http_code" != "204" ]; then
            echo "::error::Dispatch failed with HTTP ${http_code}"
            exit 1
          fi

      - name: POST repository_dispatch to sac (PR-variant, pull_request event)
        # PR-side dispatch: sent only on `pull_request` events.
        # Triggers `simple_and_clean-pr` in sac, which the two PR
        # variants (`integration-test-pr`,
        # `integration-test-pr-unmodified`) listen for. Skipped on
        # `push` events; the post-merge canary dispatch (previous
        # step) handles that case. Splitting the event_type by
        # trigger means the post-merge canaries don't run on PRs and
        # the PR variants don't run on pushes - they each only
        # START for the trigger where their output is meaningful.
        if: github.event_name == 'pull_request'
        id: dispatch-pr
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "dispatch_time_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
          payload=$(cat <<EOF
          {
            "event_type": "simple_and_clean-pr",
            "client_payload": {
              "sha": "${SHA}",
              "ref": "${REF}",
              "repository": "${REPO}",
              "sender": "${ACTOR}"
            }
          }
          EOF
          )

          echo "POST https://api.github.com/repos/SaCScaffolder/sac/dispatches"
          echo "Payload:"
          echo "$payload"

          http_code=$(curl -sS -o /tmp/dispatch_pr_body.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            https://api.github.com/repos/SaCScaffolder/sac/dispatches)

          echo "HTTP ${http_code}"
          echo "Body:"
          cat /tmp/dispatch_pr_body.json
          echo

          if [ "$http_code" != "204" ]; then
            echo "::error::PR dispatch failed with HTTP ${http_code}"
            exit 1
          fi

      - name: Find the resulting sac integration-test-unmodified run
        # Post-merge canary: this watcher only runs on `push` events
        # (i.e. a commit landing on `main`). On `pull_request` events
        # we skip this step and let the PR-variant watchers below
        # (`find-run-pr`, `find-run-pr-unmod`) do the work instead.
        # With the event_type split (this PR pair), sac's PR-variant
        # workflows don't even START on a push dispatch -- the
        # `simple_and_clean-pr` event_type isn't sent on push. This
        # if-guard is belt-and-suspenders: even if a listener were
        # misconfigured, this workflow still wouldn't wait on a
        # PR-variant watcher for a push event. Without this guard,
        # a PR would wait for the post-merge canary (which runs
        # against main's SHA, not the PR head's SHA) and report
        # success/failure against the wrong commit context.
        if: github.event_name == 'push'
        id: find-run
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          # We dispatched the repository_dispatch in the previous step;
          # the resulting workflow runs land within a couple of seconds.
          # An older failed run with the same `display_title` could be
          # the first match if we don't filter on recency. We compute
          # the cutoff as (dispatch_time - 60s) so we only consider
          # runs that appeared after our dispatch. Computed in the
          # run: block below because ${{ }} expressions can't do
          # arithmetic on step outputs.
        run: |
          # Compute cutoff as dispatch_time (in ms) minus 60s, in seconds.
          # References `dispatch-updated` (the push-side dispatch step)
          # since this find-run only fires for push events.
          DISPATCH_MS=${{ steps.dispatch-updated.outputs.dispatch_time_ms }}
          export CUTOFF_EPOCH=$(( (DISPATCH_MS - 60000) / 1000 ))
          echo "Cutoff epoch seconds: ${CUTOFF_EPOCH}"
          # Poll the sac repo's recent repository_dispatch runs until we
          # find one whose display_title matches our event_type AND
          # whose created_at is newer than our dispatch's cutoff. The
          # `head_sha` on a repository_dispatch run is the commit sac
          # checked out (i.e. sac's own main), NOT the SHA we dispatched
          # with -- so we filter on display_title + recency instead.
          # We also use `event=repository_dispatch` so unrelated runs
          # (push-triggered integration tests) don't match.
          #
          # Why the cutoff: the dispatch itself returns HTTP 204 in
          # ~1s, but the resulting workflow runs are not in the API
          # yet when we start polling. Without the recency filter, the
          # first poll can match an *old* run from a previous dispatch
          # and `gh run watch` it -- reporting the old failure as if
          # it were our new one.
          for i in $(seq 1 30); do
            RUN_ID=$(curl -sS \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/SaCScaffolder/sac/actions/runs?event=repository_dispatch&per_page=10" \
              | python -c "
          import json, sys, os, datetime
          runs = json.load(sys.stdin).get('workflow_runs', [])
          cutoff = datetime.datetime.fromtimestamp(int(os.environ['CUTOFF_EPOCH']), tz=datetime.timezone.utc)
          for r in runs:
              wf_path = r.get('path', '')
              title = r.get('display_title', '')
              created = datetime.datetime.fromisoformat(r['created_at'].replace('Z', '+00:00'))
              status = r.get('status', '')
              conclusion = r.get('conclusion', '')
              # Only match runs that are still active. Skip cancelled,
              # completed-success, and completed-failure runs -- those
              # are typically from a *previous* dispatch (e.g. a
              # concurrent PR's watcher) that already concluded, or
              # from a cancelled run that was superseded by a newer
              # one. Without this filter, the watch step would pick
              # up a stale cancelled/already-finished run and report
              # failure for a test that's actually still running on a
              # newer run. NOTE: the comment avoids backticks because
              # this Python code is inside a bash double-quoted string
              # (python -c "..."), and bash would evaluate backticks
              # as command substitution -- even on a comment line.
              if 'integration-test-unmodified' in wf_path \
                 and title == 'simple_and_clean-updated' \
                 and created >= cutoff \
                 and (status in ('queued', 'in_progress', 'waiting', 'pending') or status == 'completed')):
                  print(r['id'])
                  break
          ")
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
              echo "Found sac integration-test-unmodified run ${RUN_ID}"
              exit 0
            fi
            echo "  attempt $i/30: no matching sac run yet (or matched run was already terminal), sleeping 5s"
            sleep 5
          done
          echo "::error::No active sac integration-test-unmodified run appeared within 150s of dispatch"
          exit 1

      - name: Watch sac integration-test-unmodified run to completion
        # Skipped on `pull_request` events; see the comment on
        # `find-run` for the rationale.
        if: github.event_name == 'push'
        id: watch
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # If the matched run was cancelled mid-watch (e.g. a
          # concurrent dispatch's concurrency group superseded
          # it), the simple gh run watch invocation would exit 1
          # on a cancelled run, even though a *newer* in-progress
          # run from the same dispatch is still alive. Re-find
          # and re-watch on cancellation. Cap retries at 6 to
          # avoid pathological loops.
          DISPATCH_MS=${{ steps.dispatch-updated.outputs.dispatch_time_ms }}
          export CUTOFF_EPOCH=$(( (DISPATCH_MS - 60000) / 1000 ))
          for attempt in $(seq 1 6); do
            # Re-find the most recent active run.
            RUN_ID=$(curl -sS \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/SaCScaffolder/sac/actions/runs?event=repository_dispatch&per_page=10" \
              | python -c "
          import json, sys, os, datetime
          runs = json.load(sys.stdin).get('workflow_runs', [])
          cutoff = datetime.datetime.fromtimestamp(int(os.environ['CUTOFF_EPOCH']), tz=datetime.timezone.utc)
          for r in runs:
              wf_path = r.get('path', '')
              title = r.get('display_title', '')
              created = datetime.datetime.fromisoformat(r['created_at'].replace('Z', '+00:00'))
              status = r.get('status', '')
              conclusion = r.get('conclusion', '')
              if 'integration-test-unmodified' in wf_path \
                 and title == 'simple_and_clean-updated' \
                 and created >= cutoff \
                 and (status in ('queued', 'in_progress', 'waiting', 'pending') or status == 'completed')):
                  print(r['id'])
                  break
          ")
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "  watch attempt $attempt/6: no active sac run to watch, sleeping 5s"
              sleep 5
              continue
            fi
            echo "  watch attempt $attempt/6: watching sac run ${RUN_ID}"
            if GH_TOKEN="${TOKEN}" gh run watch "${RUN_ID}" --repo SaCScaffolder/sac --exit-status; then
              echo "::notice::sac integration-test-unmodified passed for ${{ github.sha }}"
              exit 0
            fi
            # gh run watch returned non-zero. Inspect the run's
            # conclusion. If cancelled, re-find; if failure,
            # propagate the real failure. If unknown (the API
            # hasn't been updated yet), treat as still in-progress
            # and re-find.
            CONCLUSION=$(gh api "repos/SaCScaffolder/sac/actions/runs/${RUN_ID}" --jq '.conclusion' 2>/dev/null || echo "unknown")
            if [ "$CONCLUSION" = "cancelled" ]; then
              echo "  run ${RUN_ID} was cancelled, looking for a newer active run"
              sleep 3
              continue
            fi
            if [ -z "$CONCLUSION" ] || [ "$CONCLUSION" = "null" ] || [ "$CONCLUSION" = "unknown" ] || [ "$CONCLUSION" = "" ]; then
              echo "  run ${RUN_ID} conclusion unknown (API may be lagging), re-finding"
              sleep 3
              continue
            fi
            echo "  run ${RUN_ID} concluded with ${CONCLUSION}, propagating failure"
            exit 1
          done
          echo "::error::No sac integration-test-unmodified run completed within 6 watch retries"
          exit 1

      - name: Find the resulting sac integration-test-modified run
        # Post-merge canary for the modified example: this watcher
        # runs on `push` events (commit to main) to wait on the
        # modified-variant integration test in sac, which exercises
        # the `servicectl refresh` path against the persistent
        # `sac_example_ala_service_modified` fixture. Skipped on
        # `pull_request` events because its output is only meaningful
        # for the main SHA, not a PR head SHA.
        #
        # Filter: matches `integration-test-modified` in the workflow
        # path but NOT `integration-test-pr-modified` (no such file
        # today) and NOT `integration-test-modified-cleanup` or similar
        # infrastructure variants. The exclusion pattern mirrors the
        # other find-run steps to keep the filtering discipline
        # consistent.
        if: github.event_name == 'push'
        id: find-run-modified
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          DISPATCH_MS=${{ steps.dispatch-updated.outputs.dispatch_time_ms }}
          export CUTOFF_EPOCH=$(( (DISPATCH_MS - 60000) / 1000 ))
          echo "Cutoff epoch seconds: ${CUTOFF_EPOCH}"
          for i in $(seq 1 30); do
            RUN_ID=$(curl -sS \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/SaCScaffolder/sac/actions/runs?event=repository_dispatch&per_page=10" \
              | python -c "
          import json, sys, os, datetime
          runs = json.load(sys.stdin).get('workflow_runs', [])
          cutoff = datetime.datetime.fromtimestamp(int(os.environ['CUTOFF_EPOCH']), tz=datetime.timezone.utc)
          for r in runs:
              wf_path = r.get('path', '')
              title = r.get('display_title', '')
              created = datetime.datetime.fromisoformat(r['created_at'].replace('Z', '+00:00'))
              status = r.get('status', '')
              conclusion = r.get('conclusion', '')
              if 'integration-test-modified' in wf_path \
                 and 'integration-test-pr-modified' not in wf_path \
                 and title == 'simple_and_clean-updated' \
                 and created >= cutoff \
                 and (status in ('queued', 'in_progress', 'waiting', 'pending') or status == 'completed')):
                  print(r['id'])
                  break
          ")
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
              echo "Found sac integration-test-modified run ${RUN_ID}"
              exit 0
            fi
            echo "  attempt $i/30: no matching sac modified run yet (or matched run was already terminal), sleeping 5s"
            sleep 5
          done
          echo "::error::No active sac integration-test-modified run appeared within 150s of dispatch"
          exit 1

      - name: Watch sac integration-test-modified run to completion
        # Skipped on `pull_request` events; see the comment on
        # `find-run-modified` for the rationale. On a push to main,
        # any failure in this watch step propagates as the workflow
        # run's own failure status, which is what gates the push
        # (no separate commit status is set for the modified canary
        # because pushes don't have a PR check list to display it on).
        if: github.event_name == 'push'
        id: watch-modified
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          DISPATCH_MS=${{ steps.dispatch-updated.outputs.dispatch_time_ms }}
          export CUTOFF_EPOCH=$(( (DISPATCH_MS - 60000) / 1000 ))
          for attempt in $(seq 1 6); do
            RUN_ID=$(curl -sS \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/SaCScaffolder/sac/actions/runs?event=repository_dispatch&per_page=10" \
              | python -c "
          import json, sys, os, datetime
          runs = json.load(sys.stdin).get('workflow_runs', [])
          cutoff = datetime.datetime.fromtimestamp(int(os.environ['CUTOFF_EPOCH']), tz=datetime.timezone.utc)
          for r in runs:
              wf_path = r.get('path', '')
              title = r.get('display_title', '')
              created = datetime.datetime.fromisoformat(r['created_at'].replace('Z', '+00:00'))
              status = r.get('status', '')
              conclusion = r.get('conclusion', '')
              if 'integration-test-modified' in wf_path \
                 and 'integration-test-pr-modified' not in wf_path \
                 and title == 'simple_and_clean-updated' \
                 and created >= cutoff \
                 and (status in ('queued', 'in_progress', 'waiting', 'pending') or status == 'completed')):
                  print(r['id'])
                  break
          ")
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "  watch attempt $attempt/6: no active sac modified run to watch, sleeping 5s"
              sleep 5
              continue
            fi
            echo "  watch attempt $attempt/6: watching sac modified run ${RUN_ID}"
            if GH_TOKEN="***" gh run watch "${RUN_ID}" --repo SaCScaffolder/sac --exit-status; then
              echo "::notice::sac integration-test-modified passed for ${{ github.sha }}"
              exit 0
            fi
            CONCLUSION=$(gh api "repos/SaCScaffolder/sac/actions/runs/${RUN_ID}" --jq '.conclusion' 2>/dev/null || echo "unknown")
            if [ "$CONCLUSION" = "cancelled" ]; then
              echo "  run ${RUN_ID} was cancelled, looking for a newer active run"
              sleep 3
              continue
            fi
            if [ -z "$CONCLUSION" ] || [ "$CONCLUSION" = "null" ] || [ "$CONCLUSION" = "unknown" ] || [ "$CONCLUSION" = "" ]; then
              echo "  run ${RUN_ID} conclusion unknown (API may be lagging), re-finding"
              sleep 3
              continue
            fi
            echo "  run ${RUN_ID} concluded with ${CONCLUSION}, propagating failure"
            exit 1
          done
          echo "::error::No sac integration-test-modified run completed within 6 watch retries"
          exit 1

      - name: Set pending status on PR head (PR variant, yellow while waiting)
        # Sets a SECOND commit status on the simple_and_clean PR's
        # head SHA, with context `simple_and_clean / sac-integration-test-pr`.
        # This is the yellow-while-waiting signal for the PR-variant
        # watcher (added in PR #109). The unmodified watcher has its
        # own context (`simple_and_clean / sac-integration-test`).
        # Two separate contexts so each watcher's status is
        # independently visible on the PR check list -- a slow
        # PR-variant run doesn't block the unmodified status (and
        # vice versa) from going green.
        #
        # For push events, no-op (the if: guard requires pull_request).
        if: github.event_name == 'pull_request'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "::add-mask::${TOKEN}"
          http_code=$(curl -sS -o /tmp/pending_pr_body.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "{\"state\":\"pending\",\"description\":\"Waiting for SAC per-PR integration test to complete\",\"context\":\"simple_and_clean / sac-integration-test-pr\"}" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${SHA}")
          if [ "${http_code}" != "201" ]; then
            echo "::warning::Failed to set PR-variant pending status (HTTP ${http_code})"
            cat /tmp/pending_pr_body.json || true
          else
            echo "Set PR-variant pending status on ${SHA}"
          fi

      - name: Find the resulting sac integration-test-pr run
        # The PR variant of the modified integration test
        # (SaCScaffolder/sac/.github/workflows/integration-test-pr.yml)
        # also fires on the `simple_and_clean-updated` dispatch (it
        # has both `pull_request` and `repository_dispatch` triggers
        # after PR #109). The PR variant validates the scaffolder's
        # idempotency on a per-PR fixture -- different validation
        # surface than the unmodified test, complementary.
        #
        # Same recency-filter pattern as the unmodified find-run:
        # poll until we find a run newer than dispatch_time - 60s.
        # Different filter string: this one matches
        # `integration-test-pr` (no `-unmodified` suffix), so it
        # doesn't double-match the unmodified run we just watched.
        #
        # Skipped on `push` events: PR-variant watchers only make
        # sense for PR head SHAs. A post-merge push should only
        # wait for the post-merge canaries (`find-run` and
        # `find-run-modified`); the PR-variant workflows don't
        # even START on a push because they only listen for the
        # `simple_and_clean-pr` event_type, which isn't sent on
        # push. This if-guard is belt-and-suspenders.
        if: github.event_name == 'pull_request'
        id: find-run-pr
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          DISPATCH_MS=${{ steps.dispatch-pr.outputs.dispatch_time_ms }}
          export CUTOFF_EPOCH=$(( (DISPATCH_MS - 60000) / 1000 ))
          echo "Cutoff epoch seconds: ${CUTOFF_EPOCH}"
          for i in $(seq 1 30); do
            RUN_ID=$(curl -sS \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/SaCScaffolder/sac/actions/runs?event=repository_dispatch&per_page=10" \
              | python -c "
          import json, sys, os, datetime
          runs = json.load(sys.stdin).get('workflow_runs', [])
          cutoff = datetime.datetime.fromtimestamp(int(os.environ['CUTOFF_EPOCH']), tz=datetime.timezone.utc)
          for r in runs:
              wf_path = r.get('path', '')
              title = r.get('display_title', '')
              created = datetime.datetime.fromisoformat(r['created_at'].replace('Z', '+00:00'))
              # Match the integration-test-pr workflow path but NOT
              # integration-test-pr-cleanup or -pr-sweeper (those are
              # infrastructure workflows, not the test). NOTE: this
              # Python code is inside a bash double-quoted string
              # (python -c "..."), so backticks in comments would be
              # evaluated as command substitution -- we use plain text
              # below to avoid that.
              if 'integration-test-pr' in wf_path \
                 and 'integration-test-pr-cleanup' not in wf_path \
                 and 'integration-test-pr-sweeper' not in wf_path \
                 and title == 'simple_and_clean-pr' \
                 and created >= cutoff \
                 and (r.get('status', '') in ('queued', 'in_progress', 'waiting', 'pending') or r.get('status', '') == 'completed')):
                  print(r['id'])
                  break
          ")
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
              echo "Found sac integration-test-pr run ${RUN_ID}"
              echo "runs"
              exit 0
            fi
            echo "  attempt $i/30: no matching sac PR-variant run yet (or matched run was already terminal), sleeping 5s"
            sleep 5
          done
          echo "::error::No active sac integration-test-pr run appeared within 150s of dispatch"
          exit 1

      - name: Watch sac integration-test-pr run to completion
        # Skipped on `push` events; see the comment on `find-run-pr`.
        if: github.event_name == 'pull_request'
        id: watch-pr
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          DISPATCH_MS=${{ steps.dispatch-pr.outputs.dispatch_time_ms }}
          export CUTOFF_EPOCH=$(( (DISPATCH_MS - 60000) / 1000 ))
          for attempt in $(seq 1 6); do
            RUN_ID=$(curl -sS \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/SaCScaffolder/sac/actions/runs?event=repository_dispatch&per_page=10" \
              | python -c "
          import json, sys, os, datetime
          runs = json.load(sys.stdin).get('workflow_runs', [])
          cutoff = datetime.datetime.fromtimestamp(int(os.environ['CUTOFF_EPOCH']), tz=datetime.timezone.utc)
          for r in runs:
              wf_path = r.get('path', '')
              title = r.get('display_title', '')
              created = datetime.datetime.fromisoformat(r['created_at'].replace('Z', '+00:00'))
              status = r.get('status', '')
              conclusion = r.get('conclusion', '')
              if 'integration-test-pr' in wf_path \
                 and 'integration-test-pr-cleanup' not in wf_path \
                 and 'integration-test-pr-sweeper' not in wf_path \
                 and title == 'simple_and_clean-pr' \
                 and created >= cutoff \
                 and (status in ('queued', 'in_progress', 'waiting', 'pending') or status == 'completed')):
                  print(r['id'])
                  break
          ")
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "  watch attempt $attempt/6: no active sac PR-variant run to watch, sleeping 5s"
              sleep 5
              continue
            fi
            echo "  watch attempt $attempt/6: watching sac PR-variant run ${RUN_ID}"
            if GH_TOKEN="${TOKEN}" gh run watch "${RUN_ID}" --repo SaCScaffolder/sac --exit-status; then
              echo "::notice::sac integration-test-pr passed for ${{ github.sha }}"
              exit 0
            fi
            CONCLUSION=$(gh api "repos/SaCScaffolder/sac/actions/runs/${RUN_ID}" --jq '.conclusion' 2>/dev/null || echo "unknown")
            if [ "$CONCLUSION" = "cancelled" ]; then
              echo "  run ${RUN_ID} was cancelled, looking for a newer active run"
              sleep 3
              continue
            fi
            if [ -z "$CONCLUSION" ] || [ "$CONCLUSION" = "null" ] || [ "$CONCLUSION" = "unknown" ] || [ "$CONCLUSION" = "" ]; then
              echo "  run ${RUN_ID} conclusion unknown (API may be lagging), re-finding"
              sleep 3
              continue
            fi
            echo "  run ${RUN_ID} concluded with ${CONCLUSION}, propagating failure"
            exit 1
          done
          echo "::error::No sac integration-test-pr run completed within 6 watch retries"
          exit 1
          echo "::notice::sac integration-test-pr passed for ${{ github.sha }}"

      - name: Set pending status on PR head (unmodified PR variant, yellow while waiting)
        # Sets a THIRD commit status on the simple_and_clean PR's
        # head SHA, with context `simple_and_clean / sac-integration-test-pr-unmodified`.
        # This is the yellow-while-waiting signal for the unmodified
        # PR-variant watcher (added in SaCScaffolder/sac#28). The
        # other two contexts (unmodified post-merge watcher, modified
        # PR-variant watcher) have their own status pairs.
        if: github.event_name == 'pull_request'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "::add-mask::${TOKEN}"
          http_code=$(curl -sS -o /tmp/pending_pr_unmod_body.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "{\"state\":\"pending\",\"description\":\"Waiting for SAC unmodified per-PR integration test to complete\",\"context\":\"simple_and_clean / sac-integration-test-pr-unmodified\"}" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${SHA}")
          if [ "${http_code}" != "201" ]; then
            echo "::warning::Failed to set unmodified PR-variant pending status (HTTP ${http_code})"
            cat /tmp/pending_pr_unmod_body.json || true
          else
            echo "Set unmodified PR-variant pending status on ${SHA}"
          fi

      - name: Find the resulting sac integration-test-pr-unmodified run
        # The per-PR variant of the unmodified integration test
        # (SaCScaffolder/sac/.github/workflows/integration-test-pr-unmodified.yml)
        # fires on both pull_request and repository_dispatch (same as
        # the modified variant). This watcher finds the run triggered
        # by the dispatch from this workflow.
        #
        # Same recency-filter pattern as the other two find-runs.
        # Filter: matches `integration-test-pr-unmodified` in the
        # workflow path. Cleanup + sweeper are `integration-test-pr-cleanup`
        # and `integration-test-pr-sweeper` (excluded).
        #
        # Skipped on `push` events: PR-variant watchers only make
        # sense for PR head SHAs. A post-merge push should only
        # wait for the post-merge canaries (`find-run` and
        # `find-run-modified`); the PR-variant workflows don't
        # even START on a push because they only listen for the
        # `simple_and_clean-pr` event_type, which isn't sent on
        # push. This if-guard is belt-and-suspenders.
        if: github.event_name == 'pull_request'
        id: find-run-pr-unmod
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          DISPATCH_MS=${{ steps.dispatch-pr.outputs.dispatch_time_ms }}
          export CUTOFF_EPOCH=$(( (DISPATCH_MS - 60000) / 1000 ))
          echo "Cutoff epoch seconds: ${CUTOFF_EPOCH}"
          for i in $(seq 1 30); do
            RUN_ID=$(curl -sS \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/SaCScaffolder/sac/actions/runs?event=repository_dispatch&per_page=10" \
              | python -c "
          import json, sys, os, datetime
          runs = json.load(sys.stdin).get('workflow_runs', [])
          cutoff = datetime.datetime.fromtimestamp(int(os.environ['CUTOFF_EPOCH']), tz=datetime.timezone.utc)
          for r in runs:
              wf_path = r.get('path', '')
              title = r.get('display_title', '')
              created = datetime.datetime.fromisoformat(r['created_at'].replace('Z', '+00:00'))
              if 'integration-test-pr-unmodified' in wf_path \
                 and title == 'simple_and_clean-pr' \
                 and created >= cutoff \
                 and (r.get('status', '') in ('queued', 'in_progress', 'waiting', 'pending') or r.get('status', '') == 'completed')):
                  print(r['id'])
                  break
          ")
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
              echo "Found sac integration-test-pr-unmodified run ${RUN_ID}"
              exit 0
            fi
            echo "  attempt $i/30: no matching sac unmodified PR-variant run yet (or matched run was already terminal), sleeping 5s"
            sleep 5
          done
          echo "::error::No active sac integration-test-pr-unmodified run appeared within 150s of dispatch"
          exit 1

      - name: Watch sac integration-test-pr-unmodified run to completion
        # Skipped on `push` events; see the comment on
        # `find-run-pr-unmod`.
        if: github.event_name == 'pull_request'
        id: watch-pr-unmod
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          DISPATCH_MS=${{ steps.dispatch-pr.outputs.dispatch_time_ms }}
          export CUTOFF_EPOCH=$(( (DISPATCH_MS - 60000) / 1000 ))
          for attempt in $(seq 1 6); do
            RUN_ID=$(curl -sS \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/SaCScaffolder/sac/actions/runs?event=repository_dispatch&per_page=10" \
              | python -c "
          import json, sys, os, datetime
          runs = json.load(sys.stdin).get('workflow_runs', [])
          cutoff = datetime.datetime.fromtimestamp(int(os.environ['CUTOFF_EPOCH']), tz=datetime.timezone.utc)
          for r in runs:
              wf_path = r.get('path', '')
              title = r.get('display_title', '')
              created = datetime.datetime.fromisoformat(r['created_at'].replace('Z', '+00:00'))
              status = r.get('status', '')
              conclusion = r.get('conclusion', '')
              if 'integration-test-pr-unmodified' in wf_path \
                 and title == 'simple_and_clean-pr' \
