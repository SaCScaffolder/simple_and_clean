[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "servicectl"
version = "0.1.0"
description = "Self-service DevOps scaffolding. From init to green CI in under 60 seconds."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Henry Orsborn", email = "henryorsborn@gmail.com" },
]
keywords = ["devops", "scaffolding", "ci-cd", "platform-engineering", "docker", "github-actions", "azure-devops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
servicectl = "servicectl.cli:main"

[project.urls]
Homepage = "https://github.com/henryorsborn/servicectl"
Issues = "https://github.com/henryorsborn/servicectl/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
servicectl = ["templates/**/*", "deploy/**/*"]

# Pytest configuration. The --cov flags and threshold here are what CI
# enforces on push; the .githooks/pre-commit hook runs the same command so
# local matches remote (per the contract documented in 5808d00 / fd66c5d).
[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra --cov=servicectl --cov-report=term --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
