server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets emitted by Vite (e.g. /assets/index-abc123.js).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is served as a SPA — fall back to index.html so
    # client-side routing works on hard refresh / deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers — sensible defaults for an internal SPA.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}